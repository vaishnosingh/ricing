# Glyph Rice Hyprland configuration (compatibility fallback for hyprlang)
# Note: Hyprland 0.56+ natively loads hyprland.lua

# Default monitor
monitor = , preferred, auto, 1

# Environment
env = QT_QPA_PLATFORMTHEME,qtengine
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,23
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland,x11,windows
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XDG_CURRENT_DESKTOP,Hyprland

# Autostart
exec-once = ~/.config/quickshell/rice/rice start
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/libexec/hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = trash-empty 30
exec-once = hyprctl setcursor Bibata-Modern-Classic 23
exec-once = gsettings set org.gnome.desktop.interface cursor-theme Bibata-Modern-Classic
exec-once = gsettings set org.gnome.desktop.interface cursor-size 23
exec-once = mpris-proxy

# Input
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    numlock_by_default = false
    repeat_delay = 250
    repeat_rate = 35
    sensitivity = 0.0
    accel_profile = adaptive
    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        drag_lock = false
        clickfinger_behavior = true
        disable_while_typing = false
        scroll_factor = 0.8
    }
}

device {
    name = ven_27c6:00-27c6:0d45-touchpad
    sensitivity = 0.0
    tap-to-click = true
    tap-and-drag = true
    natural_scroll = true
    clickfinger_behavior = true
    disable_while_typing = false
}

device {
    name = ven_27c6:00-27c6:0d45-mouse
    sensitivity = 0.0
}

# Gestures (native 1:1 trackpad workspace swiping)
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 250
    workspace_swipe_cancel_ratio = 0.15
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 5
    workspace_swipe_create_new = true
}

gesture = 3, horizontal, workspace
gesture = 3, up, global, shell:launcher
gesture = 3, down, global, shell:altar
gesture = 3, pinchin, exec, kitty
gesture = 3, pinchout, exec, brave-browser
gesture = 4, up, special, special
gesture = 4, down, close
gesture = 4, pinchin, exec, thunar
gesture = 4, pinchout, global, shell:settings

# General
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgb(d71921) rgb(d71921) 135deg
    col.inactive_border = rgb(2a2a2a)
    layout = dwindle
    allow_tearing = false
}

# Decoration
decoration {
    rounding = 0
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        popups = true
    }
    shadow {
        enabled = true
        range = 10
        render_power = 4
        color = rgba(d7192120)
    }
}

# Animations
animations {
    enabled = true
    bezier = standard, 0.2, 0, 0, 1
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    animation = windows, 1, 5, emphasizedDecel
    animation = windowsOut, 1, 3, emphasizedAccel
    animation = fade, 1, 6, standard
    animation = workspaces, 1, 5, standard, slidevert
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

# Keybindings
bind = SUPER, SUPER_L, global, shell:launcher
bind = SUPER, A, global, shell:quick
bind = SUPER, Space, global, shell:altar
bind = SUPER, I, global, shell:settings
bind = SUPER, Escape, global, shell:power
bind = SUPER, V, global, shell:clip
bind = SUPER, Period, global, shell:charms
bind = SUPER SHIFT, W, global, shell:wall
bind = , Print, global, shell:shot
bind = SUPER, P, global, shell:pact

bind = SUPER, Q, killactive
bind = ALT, F4, killactive
bind = SUPER SHIFT, Q, exec, hyprctl kill
bind = SUPER, Return, exec, kitty
bind = SUPER, T, exec, kitty
bind = SUPER, W, togglefloating
bind = SUPER ALT, space, togglefloating
bind = SUPER, B, exec, brave-browser
bind = SUPER, E, exec, thunar
bind = SUPER, F, fullscreen, 0
bind = SUPER, L, exec, ~/.config/quickshell/rice/rice lock

# Workspaces navigation
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = SUPER ALT, 1, movetoworkspace, 1
bind = SUPER ALT, 2, movetoworkspace, 2
bind = SUPER ALT, 3, movetoworkspace, 3
bind = SUPER ALT, 4, movetoworkspace, 4
bind = SUPER ALT, 5, movetoworkspace, 5
bind = SUPER ALT, 6, movetoworkspace, 6
bind = SUPER ALT, 7, movetoworkspace, 7
bind = SUPER ALT, 8, movetoworkspace, 8
bind = SUPER ALT, 9, movetoworkspace, 9
bind = SUPER ALT, 0, movetoworkspace, 10

# Mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
