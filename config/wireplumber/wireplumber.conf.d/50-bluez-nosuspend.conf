# Prevent WirePlumber from suspending Bluetooth audio devices after idle
# This prevents TWS earbuds and headsets from disconnecting when no audio is playing
monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      },
      {
        node.name = "~bluez_input.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
